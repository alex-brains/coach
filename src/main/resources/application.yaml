spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/coach
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  media:
    upload-dir: uploads          # папка relative to working dir (корень проекта)
    allowed-types:               # разрешённые типы файлов
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/svg+xml
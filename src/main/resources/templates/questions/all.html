<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Questions</title>
</head>
<body>

<h2>Вопросы</h2>

<a href="/questions/new">➕ Добавить новый вопрос</a>
<br/><br/>

<form method="get" th:action="@{/questions}">
    <select name="topicId">
        <option value="">— все топики —</option>
        <option th:each="t : ${allTopics}"
                th:value="${t.id}"
                th:text="${t.label}"
                th:selected="${t.id == selectedTopicId}">
        </option>
    </select>
    <button type="submit">Фильтр</button>
</form>

<hr/>

<table border="1" cellpadding="6">
    <tr>
        <th>ID</th>
        <th>Вопрос</th>
        <th>Топик</th>
        <th>Дата</th>
    </tr>

    <tr th:each="q : ${questions}">
        <td>
            <a th:href="@{'/questions/' + ${q.id}}" th:text="${q.id}"></a>
        </td>
        <td th:text="${q.question}"></td>
        <td th:text="${q.topicName}"></td>
        <td th:text="${#temporals.format(q.createdAt, 'dd.MM.yyyy')}"></td>
    </tr>
</table>

</body>
</html>

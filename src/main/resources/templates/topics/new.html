<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Topic</title>
</head>
<body>

<h2>Добавить топик</h2>

<form th:action="@{/topics}" th:object="${topicForm}" method="post">

    <label>Название:</label>
    <input type="text" th:field="*{name}" />
    <div style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    <br/>
    <label>Родительский топик:</label>
    <select th:field="*{parentId}">
        <option th:value="${null}">— корневой —</option>
        <option th:each="topic : ${allTopics}"
                th:value="${topic.id}"
                th:text="${topic.name}">
        </option>
    </select>
    <br/>
    <button type="submit">Сохранить</button>

</form>

</body>
</html>
